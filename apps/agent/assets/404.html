<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>Nothing here yet</title>
    <style>
      :root {
        color-scheme: dark light;
        --bg: #07080a;
        --fg: #e7e9ee;
        --muted: #9aa3ae;
        --accent: #4f7cff;
        --line: #1c2230;
      }
      @media (prefers-color-scheme: light) {
        :root {
          --bg: #f6f7f9;
          --fg: #111418;
          --muted: #4b5563;
          --accent: #2748c9;
          --line: #d9dde5;
        }
      }
      html,
      body {
        margin: 0;
        height: 100%;
        background: var(--bg);
        color: var(--fg);
      }
      body {
        display: grid;
        place-items: center;
        padding: 16px;
        box-sizing: border-box;
        font:
          15px/1.6 ui-sans-serif,
          system-ui,
          -apple-system,
          "Segoe UI",
          sans-serif;
        background-image:
          linear-gradient(var(--line) 1px, transparent 1px),
          linear-gradient(90deg, var(--line) 1px, transparent 1px);
        background-size: 32px 32px;
      }
      main {
        max-width: 440px;
        border: 1px solid var(--line);
        background: var(--bg);
        padding: 28px;
      }
      .code {
        font:
          12px/1 ui-monospace,
          "SFMono-Regular",
          Menlo,
          monospace;
        letter-spacing: 0.12em;
        color: var(--accent);
        text-transform: uppercase;
      }
      h1 {
        font-size: 20px;
        margin: 12px 0 8px;
        font-weight: 600;
      }
      p {
        margin: 0;
        color: var(--muted);
      }
    </style>
  </head>
  <body>
    <main>
      <div class="code">[ 404 · Lumen ]</div>
      <h1>Nothing is deployed at this address yet</h1>
      <p>
        This server is running Lumen, but no app answers here. If you own it, add a domain to a
        service in your Lumen dashboard.
      </p>
    </main>
  </body>
</html>
