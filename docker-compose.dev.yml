# Development infrastructure only. The self-host compose file lives in deploy/ (Phase 11).
name: lumen-dev

services:
  postgres:
    # postgres:16-alpine pinned by the multi-arch index digest (see docs/DECISIONS.md).
    image: postgres:16-alpine@sha256:721873c34ceb9f8d8fc265984940dc982404c105f19ad51be9fdc5970a6080ea
    environment:
      POSTGRES_USER: lumen
      POSTGRES_PASSWORD: lumen
      POSTGRES_DB: lumen
    ports:
      # Set PG_PORT in .env when another Postgres already owns 5432 on your machine.
      - "${PG_PORT:-5432}:5432"
    volumes:
      - lumen_pg_dev:/var/lib/postgresql/data
    command: postgres -c log_statement=none -c shared_buffers=128MB
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lumen -d lumen"]
      interval: 5s
      timeout: 3s
      retries: 12

volumes:
  lumen_pg_dev:
