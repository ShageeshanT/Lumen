// Lumen agent protocol, version 1: types shared by every message.
syntax = "proto3";

package lumen.agent.v1;

// Carried by every request payload. `op_id` is a UUIDv7 generated by the
// sender; receivers de-duplicate on (server_id, op_id) for 24 hours, which makes
// every operation idempotent (SPEC B3, B5).
message Meta {
  string op_id = 1;
  // Sender's clock, milliseconds since the Unix epoch, corrected for the skew
  // the agent measured against the control plane.
  int64 timestamp_ms = 2;
}

// Acknowledges the request identified by op_id.
message Ack {
  string op_id = 1;
}

// Reports that the request identified by op_id failed.
message OpError {
  string op_id = 1;
  // A code from the error catalog (SPEC J6 and packages/shared/src/errors).
  string code = 2;
  string message = 3;
  map<string, string> details = 4;
}
