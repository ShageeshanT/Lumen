// Lumen agent protocol, version 1: the handshake (SPEC B5).
syntax = "proto3";

package lumen.agent.v1;

// Sent by the agent as the first message after the WebSocket opens.
message AgentHello {
  string server_id = 1;
  string agent_version = 2;
  uint32 protocol_version = 3;
  string os = 4;
  string os_version = 5;
  string arch = 6;
  uint32 cpu_cores = 7;
  uint64 memory_bytes = 8;
  uint64 disk_bytes = 9;
  string docker_version = 10;
  string public_ip = 11;
  string hostname = 12;
  string kernel = 13;
  bool caddy_running = 14;
  repeated string capabilities = 15;
  // Detected from the metadata service (oracle, aws, gcp, azure, hetzner,
  // digitalocean, other). Added by DECISIONS "Phase 02 protocol additions".
  string provider = 16;
  string region_label = 17;
}

// The control plane's answer to AgentHello.
message ControlHello {
  bool accepted = 1;
  // Set only when accepted is false; a code from the error catalog.
  string reject_reason = 2;
  uint64 desired_state_version = 3;
  AgentConfig config = 4;
  uint32 negotiated_protocol_version = 5;
  int64 server_time_ms = 6;
}

// Runtime configuration the control plane hands to the agent.
message AgentConfig {
  // Default 10.
  uint32 heartbeat_interval_s = 1;
  // Default 10.
  uint32 metrics_interval_s = 2;
  // Default 7.
  uint32 log_retention_days = 3;
  // The platform Caddy image, pinned by digest.
  string caddy_image = 4;
  // Default 20000.
  uint32 tcp_proxy_port_min = 5;
  // Default 29999.
  uint32 tcp_proxy_port_max = 6;
  // Set once after POST /v1/servers/:id/rotate-credential: the agent stores it
  // atomically and uses it from the next connection. Never logged.
  string rotated_credential = 7;
}
